name: Build Tiffin Mart Android Apps

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: '8.7'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build Customer and Owner APKs
        run: gradle -p android-app :customer:assembleDebug :owner:assembleDebug --stacktrace

      - name: Upload Customer APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tiffin-Mart-Customer-APK
          path: android-app/customer/build/outputs/apk/debug/customer-debug.apk
          if-no-files-found: error

      - name: Upload Owner APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tiffin-Mart-Owner-APK
          path: android-app/owner/build/outputs/apk/debug/owner-debug.apk
          if-no-files-found: error

      - name: Publish build status
        if: always()
        shell: bash
        run: |
          printf 'status=%s\nrun_id=%s\nrun_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\ncommit=%s\n' "${{ job.status }}" "${{ github.run_id }}" "${{ github.sha }}" > android-build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-build-status.txt
          git diff --cached --quiet || git commit -m "Report Android build status"
          git push origin HEAD:main
