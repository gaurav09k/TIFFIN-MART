name: Build Tiffin Mart Android Apps

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.7'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build Customer and Owner APKs
        run: gradle -p android-app :customer:assembleDebug :owner:assembleDebug --stacktrace

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiffin-Mart-Customer-APK
          path: android-app/customer/build/outputs/apk/debug/customer-debug.apk
          if-no-files-found: error

      - name: Upload Owner APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiffin-Mart-Owner-APK
          path: android-app/owner/build/outputs/apk/debug/owner-debug.apk
          if-no-files-found: error
