name: Fix owner password login

on:
  push:
    paths:
      - '.github/workflows/fix-owner-password-login.yml'

permissions:
  contents: write

jobs:
  fix-owner-login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore password-auth server and keep cache protection
        shell: bash
        run: |
          git show 51d678f83632b682eed48fd5adea15409ea46e96:server.js > server.js
          python - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text()
          marker = "app.use(express.static(path.join(__dirname, 'public')));"
          add = marker + "\napp.use('/admin.html', (req,res,next)=>{res.set('Cache-Control','no-store, no-cache, must-revalidate, proxy-revalidate'); res.set('Pragma','no-cache'); res.set('Expires','0'); next();});\napp.use('/owner.html', (req,res,next)=>{res.set('Cache-Control','no-store, no-cache, must-revalidate, proxy-revalidate'); res.set('Pragma','no-cache'); res.set('Expires','0'); next();});"
          if "app.use('/owner.html'" not in s:
              s = s.replace(marker, add, 1)
          p.write_text(s)
          PY

      - name: Commit fixed server
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix owner password login endpoint"
          git push
