<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiffin Mart OTP Diagnostic</title><style>body{font-family:system-ui;padding:30px;max-width:700px;margin:auto}pre{background:#f4f4f4;padding:20px;border-radius:10px}button{padding:12px 18px}</style></head><body><h1>Tiffin Mart OTP Diagnostic</h1><p>Safe diagnostic — secrets are never displayed.</p><button onclick="run()">Check</button><pre id="out">Not checked</pre><script>async function run(){try{const r=await fetch('/api/admin/status',{cache:'no-store'});const d=await r.json();document.getElementById('out').textContent=JSON.stringify(d,null,2)}catch(e){document.getElementById('out').textContent='ERROR: '+e.message}}run();</script></body></html>
