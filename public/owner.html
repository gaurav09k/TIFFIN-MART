<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Tiffin Mart Owner Dashboard</title><style>:root{--navy:#142746;--green:#2e7d32;--line:#e6e9e5;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7f4;color:var(--navy)}header{background:var(--navy);color:#fff;padding:18px 5%;display:flex;align-items:center}header strong{font-size:20px}.wrap{max-width:1250px;margin:30px auto;padding:0 18px}.notice{max-width:650px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 12px 40px #0000000d;text-align:center}.dash[hidden],.notice[hidden]{display:none}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.card span{display:block;color:var(--muted);font-size:12px}.card b{display:block;font-size:28px;margin-top:6px}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto}.table-title{padding:18px;border-bottom:1px solid var(--line);font-weight:900}.tools{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:800}.field input{padding:10px;border:1px solid #dce1dc;border-radius:10px;font:inherit}.search{flex:1;min-width:220px}.search input{width:100%;padding:10px;border:1px solid #dce1dc;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--green);color:#fff}.btn.secondary{background:#142746}.count{font-size:12px;color:var(--muted);padding:0 18px 12px}table{width:100%;border-collapse:collapse;min-width:950px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #edf0ec;font-size:12px;vertical-align:top}th{background:#f7faf7;font-size:11px;text-transform:uppercase;letter-spacing:.04em}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f6ea;color:var(--green);font-weight:800}.muted{color:var(--muted)}.err{color:#b42318;font-weight:700}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.cards{grid-template-columns:1fr}}</style></head><body><header><strong>TIFFIN MART · Owner Dashboard</strong></header><div class="wrap"><section id="notice" class="notice"><h1>Opening Owner Dashboard…</h1><p id="status" class="muted">Loading data…</p></section><section id="dash" class="dash" hidden><div class="cards"><div class="card"><span>Total Customers</span><b id="customers">0</b></div><div class="card"><span>Total Logins</span><b id="logins">0</b></div><div class="card"><span>Paid Orders</span><b id="orders">0</b></div><div class="card"><span>Pass Buyers</span><b id="buyers">0</b></div><div class="card"><span>Revenue</span><b id="revenue">₹0</b></div></div><div class="table-wrap"><div class="table-title">Customer Details & Activity</div><div class="tools"><label class="field">From Date<input type="date" id="fromDate"></label><label class="field">To Date<input type="date" id="toDate"></label><label class="field search">Search name, mobile or email<input id="search" placeholder="Search..."></label><button class="btn" id="filterBtn">Apply Filter</button><button class="btn secondary" id="resetBtn">Reset</button><button class="btn" id="exportBtn">Export Excel</button></div><div class="count" id="count">Showing 0 customers</div><table id="customerTable"><thead><tr><th>Customer</th><th>Mobile</th><th>Email</th><th>Registered</th><th>Logins</th><th>Last Login</th><th>Orders</th><th>Last Pass</th><th>Last Amount</th></tr></thead><tbody id="tbody"></tbody></table></div></section></div><script>let rows=[];const $=id=>document.getElementById(id),money=n=>'₹'+Number(n||0).toLocaleString('en-IN'),dt=x=>x?new Date(x).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'-';function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]||c))}function inRange(x){const f=$('fromDate').value,t=$('toDate').value,d=x.createdAt?new Date(x.createdAt):null;if(!d)return false;const day=d.toISOString().slice(0,10);return(!f||day>=f)&&(!t||day<=t)}function filtered(){const q=$('search').value.trim().toLowerCase();return rows.filter(x=>inRange(x)&&[x.name,x.phone,x.email].join(' ').toLowerCase().includes(q))}function render(){const list=filtered();$('count').textContent='Showing '+list.length+' customers';$('tbody').innerHTML=list.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td>${dt(x.createdAt)}</td><td><span class="badge">${x.loginCount}</span></td><td>${dt(x.lastLoginAt)}</td><td>${x.orders}</td><td>${esc(x.lastPass||'-')}</td><td>${x.lastAmount?money(x.lastAmount):'-'}</td></tr>`).join('')||'<tr><td colspan="9">No customer found.</td></tr>'}function exportExcel(){const list=filtered();let html='<table border="1"><tr><th>Name</th><th>Mobile</th><th>Email</th><th>Registration Date</th><th>Login Count</th><th>Last Login</th><th>Orders</th><th>Last Pass</th><th>Last Amount</th></tr>';html+=list.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td>${esc(dt(x.createdAt))}</td><td>${x.loginCount||0}</td><td>${esc(dt(x.lastLoginAt))}</td><td>${x.orders||0}</td><td>${esc(x.lastPass||'-')}</td><td>${x.lastAmount||''}</td></tr>`).join('');html+='</table>';const blob=new Blob(['\ufeff',html],{type:'application/vnd.ms-excel'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Tiffin-Mart-Customers-'+new Date().toISOString().slice(0,10)+'.xls';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function load(){const r=await fetch('/api/admin/summary',{cache:'no-store'});if(!r.ok)throw new Error('Owner data is still protected by the server.');const d=await r.json();rows=d.customers||[];$('customers').textContent=d.stats.customers;$('logins').textContent=d.stats.totalLogins;$('orders').textContent=d.stats.paidOrders;$('buyers').textContent=d.stats.passBuyers;$('revenue').textContent=money(d.stats.revenue);render();$('notice').hidden=true;$('dash').hidden=false}async function start(){try{await load()}catch(e){$('status').className='err';$('status').textContent=e.message||'Could not load owner data.'}}$('filterBtn').addEventListener('click',render);$('resetBtn').addEventListener('click',()=>{$('fromDate').value='';$('toDate').value='';$('search').value='';render()});$('search').addEventListener('input',render);$('exportBtn').addEventListener('click',exportExcel);start();</script></body></html>
