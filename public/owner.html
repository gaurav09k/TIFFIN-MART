<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Tiffin Mart Owner Dashboard</title><style>:root{--navy:#142746;--green:#2e7d32;--line:#e6e9e5;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7f4;color:var(--navy)}header{background:var(--navy);color:#fff;padding:18px 5%;display:flex;align-items:center}header strong{font-size:20px}.wrap{max-width:1250px;margin:30px auto;padding:0 18px}.notice{max-width:650px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 12px 40px #0000000d;text-align:center}.dash[hidden],.notice[hidden]{display:none}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.card span{display:block;color:var(--muted);font-size:12px}.card b{display:block;font-size:28px;margin-top:6px}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto}.table-title{padding:18px;border-bottom:1px solid var(--line);font-weight:900}.search{padding:12px 18px;border-bottom:1px solid var(--line)}.search input{width:100%;padding:11px;border:1px solid #dce1dc;border-radius:10px;font:inherit}table{width:100%;border-collapse:collapse;min-width:950px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #edf0ec;font-size:12px;vertical-align:top}th{background:#f7faf7;font-size:11px;text-transform:uppercase;letter-spacing:.04em}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f6ea;color:var(--green);font-weight:800}.muted{color:var(--muted)}.err{color:#b42318;font-weight:700}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.cards{grid-template-columns:1fr}}</style></head><body><header><strong>TIFFIN MART · Owner Dashboard</strong></header><div class="wrap"><section id="notice" class="notice"><h1>Opening Owner Dashboard…</h1><p id="status" class="muted">Loading data…</p></section><section id="dash" class="dash" hidden><div class="cards"><div class="card"><span>Total Customers</span><b id="customers">0</b></div><div class="card"><span>Total Logins</span><b id="logins">0</b></div><div class="card"><span>Paid Orders</span><b id="orders">0</b></div><div class="card"><span>Pass Buyers</span><b id="buyers">0</b></div><div class="card"><span>Revenue</span><b id="revenue">₹0</b></div></div><div class="table-wrap"><div class="table-title">Customer Details & Activity</div><div class="search"><input id="search" placeholder="Search name, mobile or email"></div><table><thead><tr><th>Customer</th><th>Mobile</th><th>Email</th><th>Registered</th><th>Logins</th><th>Last Login</th><th>Orders</th><th>Last Pass</th><th>Last Amount</th></tr></thead><tbody id="tbody"></tbody></table></div></section></div><script>let rows=[];const $=id=>document.getElementById(id),money=n=>'₹'+Number(n||0).toLocaleString('en-IN'),dt=x=>x?new Date(x).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'-';function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]||c))}function render(){const q=$('search').value.trim().toLowerCase();$('tbody').innerHTML=rows.filter(x=>[x.name,x.phone,x.email].join(' ').toLowerCase().includes(q)).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td>${dt(x.createdAt)}</td><td><span class="badge">${x.loginCount}</span></td><td>${dt(x.lastLoginAt)}</td><td>${x.orders}</td><td>${esc(x.lastPass||'-')}</td><td>${x.lastAmount?money(x.lastAmount):'-'}</td></tr>`).join('')||'<tr><td colspan="9">No customer found.</td></tr>'}async function load(){const r=await fetch('/api/admin/summary',{cache:'no-store'});if(!r.ok)throw new Error('Owner data is still protected by the server.');const d=await r.json();rows=d.customers||[];$('customers').textContent=d.stats.customers;$('logins').textContent=d.stats.totalLogins;$('orders').textContent=d.stats.paidOrders;$('buyers').textContent=d.stats.passBuyers;$('revenue').textContent=money(d.stats.revenue);render();$('notice').hidden=true;$('dash').hidden=false}async function start(){try{await load()}catch(e){$('status').className='err';$('status').textContent=e.message||'Could not load owner data.'}}$('search').addEventListener('input',render);start();</script></body></html>
